name: Feature request
description: Suggest an idea for this project
title: "Feature: "
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem are you trying to solve? Concrete scenarios help the most
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen, and how would the feature work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have tried
    validations:
      required: false

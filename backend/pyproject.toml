[project]
name = "purl-backend"
version = "0.2.0"
description = "Purl AI — AI design generation service backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Workaround: default pytracer misses coroutine lines after `await` in TestClient threads,
# under-reporting endpoint coverage; sys.monitoring core (PEP 669) traces threads correctly.
[tool.coverage.run]
core = "sysmon"

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
